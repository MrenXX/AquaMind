<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AquaMind Artifact Test</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; background: #0f172a; color: #e2e8f0; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    table { border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #334155; padding: 0.5rem 1rem; text-align: left; }
    th { background: #1e293b; }
    .chart-wrap { margin-top: 1.5rem; max-width: 420px; }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <h1>AquaMind Artifact Test</h1>
  <p>Daily consumption (sample)</p>
  <table id="data-table">
    <thead><tr><th>Date</th><th>Consumption</th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="chart-wrap">
    <svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" aria-label="Consumption bar chart">
      <rect x="0" y="0" width="400" height="220" fill="#1e293b" rx="8" />
      <text x="200" y="28" fill="#94a3b8" font-size="14" text-anchor="middle">Liters (sample)</text>
      <g id="bars"></g>
    </svg>
  </div>
  <script>
    const data = [
      { date: "2026-05-01", consumption: 1200 },
      { date: "2026-05-02", consumption: 1800 }
    ];
    const tbody = document.querySelector("#data-table tbody");
    const bars = document.getElementById("bars");
    const max = Math.max(...data.map(d => d.consumption));
    data.forEach((row, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${row.date}</td><td>${row.consumption}</td>`;
      tbody.appendChild(tr);
      const w = 72;
      const h = (row.consumption / max) * 120;
      const x = 80 + i * 140;
      const y = 170 - h;
      const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      rect.setAttribute("x", x);
      rect.setAttribute("y", y);
      rect.setAttribute("width", w);
      rect.setAttribute("height", h);
      rect.setAttribute("fill", "#38bdf8");
      rect.setAttribute("rx", "4");
      bars.appendChild(rect);
      const lab = document.createElementNS("http://www.w3.org/2000/svg", "text");
      lab.setAttribute("x", x + w / 2);
      lab.setAttribute("y", 190);
      lab.setAttribute("fill", "#cbd5e1");
      lab.setAttribute("font-size", "11");
      lab.setAttribute("text-anchor", "middle");
      lab.textContent = row.date.slice(5);
      bars.appendChild(lab);
    });
  </script>
</body>
</html>
